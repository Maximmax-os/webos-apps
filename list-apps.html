<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webOS Launcher</title>
<style>
  :root{
    --card: 200px;
    --gap: 26px;
    --pad: 60px;
    --inner: 1330px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }

  body{
    background:#060608;
    color:#fff;
    font-family:"LG Smart UI","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    user-select:none;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- ЗАСТАВКА (SPLASH) ---------- */
  .splash{
    position:fixed; inset:0; z-index:9999;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .7s ease;
    opacity:1;
  }
  .splash.hide{ opacity:0; pointer-events:none; }

  .splash-gif{
    display:block;
    max-width:34vmin;
    max-height:34vmin;
    object-fit:contain;
  }
  /* Резервный CSS-спиннер, если gif не загрузится */
  .splash-spinner{
    display:none;
    width:70px; height:70px;
    border:4px solid rgba(255,255,255,.14);
    border-top-color:#e6003d;
    border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- ФОН ---------- */
  .bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(45% 40% at 14% 4%,  rgba(165,0,52,.55),  transparent 70%),
      radial-gradient(40% 35% at 90% 10%, rgba(0,110,255,.32), transparent 70%),
      radial-gradient(65% 55% at 50% 118%,rgba(110,0,190,.45), transparent 70%),
      #060608;
  }
  .bg::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(6,6,8,0) 0%,
      rgba(6,6,8,.55) 55%,
      rgba(6,6,8,.96) 100%);
  }

  .wrap{
    position:relative; z-index:1;
    height:100%;
    display:flex; flex-direction:column;
  }

  /* ---------- ШАПКА ---------- */
  .topbar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding: 26px var(--pad) 6px;
  }
  .brand{ display:flex; align-items:baseline; gap:12px; }
  .brand .lg{
    font-size:26px; font-weight:700; letter-spacing:-.01em; color:#e6003d;
    text-shadow:0 0 26px rgba(230,0,61,.45);
  }
  .brand .sub{
    font-size:13px; letter-spacing:.3em; text-transform:uppercase;
    opacity:.42; font-weight:500;
  }
  .clock{
    font-size:24px; font-weight:300; opacity:.7;
    font-variant-numeric:tabular-nums;
    letter-spacing:.04em;
  }

  /* ---------- СЦЕНА ---------- */
  .stage{
    flex:1 1 auto;
    overflow-y:auto; overflow-x:hidden;
    padding: 14px var(--pad) 30px;
    scrollbar-width:none; -ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;
  }
  .stage::-webkit-scrollbar{ display:none; }

  .inner{ max-width:var(--inner); margin:0 auto; }

  .section-title{
    font-size:14px; letter-spacing:.24em; text-transform:uppercase;
    opacity:.4; font-weight:500; margin: 4px 0 24px 2px;
  }

  .grid{
    display:flex; flex-wrap:wrap;
    gap: var(--gap);
    justify-content:flex-start;
  }

  /* ---------- КАРТОЧКА ---------- */
  .card{
    position:relative;
    width:var(--card); height:var(--card);
    flex:0 0 auto;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:16px; padding:16px;

    border-radius:26px;
    text-decoration:none; color:#fff;
    background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
    border:1px solid rgba(255,255,255,.09);
    outline:none;
    will-change:transform;
    transition:
      transform .18s cubic-bezier(.2,.8,.3,1),
      background .18s ease,
      border-color .18s ease,
      box-shadow .18s ease;
    animation: cardIn .45s cubic-bezier(.2,.8,.3,1) backwards;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(16px); }
    to  { opacity:1; transform:none; }
  }

  .card:focus{
    transform:scale(1.08);
    background:linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.07));
    border-color:rgba(255,255,255,.9);
    box-shadow:
      0 0 0 3px rgba(255,255,255,.95),
      0 20px 45px rgba(0,0,0,.65),
      0 0 70px rgba(0,150,255,.28);
    z-index:5;
  }
  .card:focus .icon{ transform:scale(1.06); }

  @media (hover:hover){
    .card:hover{
      background:linear-gradient(160deg, rgba(255,255,255,.17), rgba(255,255,255,.06));
      border-color:rgba(255,255,255,.4);
    }
  }

  .card .icon{
    width:78px; height:78px;
    border-radius:22px;
    display:flex; align-items:center; justify-content:center;
    font-size:32px; font-weight:700; line-height:1;
    letter-spacing:-.02em;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      0 10px 22px rgba(0,0,0,.45);
    transition: transform .18s cubic-bezier(.2,.8,.3,1);
  }

  .card .name{
    font-size:16px; font-weight:500; line-height:1.25;
    max-width:100%; text-align:center;
    opacity:.9;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* ---------- ПОДСКАЗКИ ---------- */
  .hintbar{
    flex:0 0 auto;
    display:flex; flex-wrap:wrap; gap:32px; align-items:center;
    padding: 0 var(--pad) 24px;
    font-size:14px; opacity:.38; letter-spacing:.05em;
  }
  kbd{
    display:inline-block;
    padding:3px 9px; margin-right:8px;
    border-radius:7px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.16);
    font-family:inherit; font-size:13px;
  }

  @media (max-width:1500px){ :root{ --pad:44px; --inner:1110px; } }
  @media (max-width:1200px){ :root{ --card:170px; --gap:20px; --pad:32px; --inner:100%; } }
  @media (max-width:800px){
    :root{ --card:140px; --gap:16px; --pad:20px; }
    .card .icon{ width:60px; height:60px; border-radius:18px; font-size:26px; }
    .card .name{ font-size:14px; }
    .hintbar{ display:none; }
  }
</style>
</head>
<body>

<!-- ============ ЗАСТАВКА ============ -->
<div class="splash" id="splash">
  <img class="splash-gif" id="splashGif" alt="">
  <div class="splash-spinner" id="splashSpinner"></div>
</div>

<div class="bg"></div>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <span class="lg">webOS</span>
      <span class="sub">launcher</span>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <main class="stage" id="stage">
    <div class="inner">
      <h2 class="section-title">Мои приложения</h2>
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <footer class="hintbar">
    <span><kbd>← ↑ ↓ →</kbd> навигация</span>
    <span><kbd>OK</kbd> открыть</span>
    <span><kbd>Back</kbd> назад</span>
  </footer>
</div>

<script>
/* ============================================================
   НАСТРОЙКИ ЗАСТАВКИ
   - SPLASH_GIF_URL — ссылка на гифку (можно локальный путь,
     например "loading.gif" рядом с index.html)
   - SPLASH_DURATION — сколько миллисекунд держать заставку (5000 = 5 сек)
   ============================================================ */
const SPLASH_GIF_URL  = "https://i.gifer.com/ZZ5H.gif";
const SPLASH_DURATION = 5000;

/* ---------- СПИСОК ПРИЛОЖЕНИЙ ---------- */
const APPS = [
  { name: "Змейка",   url: "https://www.youtube.com",            icon: "▶",  color: "#ff0033" },
  { name: "Перевёртыш", url: "https://www.kinopoisk.ru",           icon: "К",  color: "#ff5500" },
  { name: "X",    url: "https://www.twitch.tv",              icon: "🎮", color: "#9146ff" },
  { name: "X",  url: "https://vk.com/video",               icon: "VK", color: "#0077ff" },
  { name: "X",    url: "https://rutube.ru",                  icon: "R",  color: "#00a651" },
  { name: "X",   url: "https://open.spotify.com",           icon: "♫",  color: "#1db954" },
  { name: "X",  url: "https://web.telegram.org",           icon: "✈",  color: "#2aabee" },
  { name: "X",    url: "https://yandex.ru/pogoda",           icon: "☀",  color: "#f5a623" },
  { name: "X",       url: "https://www.ivi.ru",                 icon: "и",  color: "#ff3b30" },
  { name: "X",      url: "https://okko.tv",                    icon: "О",  color: "#ff7a00" },
  { name: "X",     url: "https://store.steampowered.com",     icon: "S",  color: "#1b2838" },
  { name: "X",    url: "https://github.com",                 icon: "⌥",  color: "#6e5494" }
];

const OPEN_IN_NEW_TAB = true;

/* ============================================================
   Отрисовка карточек
   ============================================================ */
const grid  = document.getElementById('grid');
const stage = document.getElementById('stage');

function shade(hex, amt){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const f = v => Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

APPS.forEach((app, i) => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = app.url;
  if (OPEN_IN_NEW_TAB){
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  }
  a.dataset.url = app.url;
  a.style.animationDelay = (i * 35) + 'ms';

  const icon = document.createElement('div');
  icon.className = 'icon';
  icon.textContent = app.icon;
  icon.style.background =
    `linear-gradient(150deg, ${shade(app.color, .30)}, ${shade(app.color, -.42)})`;

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = app.name;

  a.appendChild(icon);
  a.appendChild(name);
  grid.appendChild(a);
});

const cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));

/* ============================================================
   Навигация по геометрии карточек
   ============================================================ */
function centerOf(el){
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function focusCard(el, doScroll){
  if (!el) return;
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  if (doScroll !== false && el.scrollIntoView){
    el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }
}

function moveFocus(dir){
  const active = document.activeElement;
  const curIdx = cards.indexOf(active);

  if (curIdx === -1){
    focusCard(cards[0]);
    return;
  }

  const cur = cards[curIdx];
  const c = centerOf(cur);
  let best = null, bestScore = Infinity;

  for (let i = 0; i < cards.length; i++){
    const el = cards[i];
    if (el === cur) continue;

    const p = centerOf(el);
    const dx = p.x - c.x;
    const dy = p.y - c.y;

    let primary, secondary;

    if (dir === 'left'){   if (dx > -1) continue; primary = -dx; secondary = Math.abs(dy); }
    if (dir === 'right'){  if (dx <  1) continue; primary =  dx; secondary = Math.abs(dy); }
    if (dir === 'up'){     if (dy > -1) continue; primary = -dy; secondary = Math.abs(dx); }
    if (dir === 'down'){   if (dy <  1) continue; primary =  dy; secondary = Math.abs(dx); }

    const score = primary + secondary * 3;
    if (score < bestScore){ bestScore = score; best = el; }
  }

  if (best) focusCard(best);
}

/* ============================================================
   Пульт / клавиатура
   (пока идёт заставка — игнорируем ввод)
   ============================================================ */
let splashActive = true;

const DIR = { 37:'left', 38:'up', 39:'right', 40:'down' };

document.addEventListener('keydown', function(e){
  if (splashActive) return;

  const k = e.keyCode;

  if (DIR[k]){
    e.preventDefault();
    moveFocus(DIR[k]);
    return;
  }

  if (k === 13 || e.key === 'Enter'){
    const el = document.activeElement;
    if (el && el.classList && el.classList.contains('card')){
      e.preventDefault();
      el.click();
    }
    return;
  }

  if (k === 461 || k === 27 || k === 8){
    e.preventDefault();
    if (window.history.length > 1) window.history.back();
    return;
  }
}, false);

/* ============================================================
   Часы
   ============================================================ */
function tick(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = hh + ':' + mm;
}
tick();
setInterval(tick, 10000);

/* ============================================================
   ЗАСТАВКА: показываем гифку, через SPLASH_DURATION — прячем
   ============================================================ */
(function initSplash(){
  const splash    = document.getElementById('splash');
  const gif       = document.getElementById('splashGif');
  const spinner   = document.getElementById('splashSpinner');

  // Если gif не загрузился — показываем резервный спиннер
  gif.addEventListener('error', function(){
    gif.style.display = 'none';
    spinner.style.display = 'block';
  });

  gif.src = SPLASH_GIF_URL;

  setTimeout(function(){
    splash.classList.add('hide');

    // после исчезновения — удаляем и включаем управление
    setTimeout(function(){
      splash.remove();
      splashActive = false;
      focusCard(cards[0], false);
    }, 700);

  }, SPLASH_DURATION);
})();
</script>
</body>
</html>
