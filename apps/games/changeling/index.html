<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Перевёртыш</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f4ecd8;
    cursor:none;font-family:Georgia,'Times New Roman',serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:22px;left:30px;right:30px;color:#1f1a16;
    font-size:clamp(16px,1.8vw,22px);letter-spacing:.04em;pointer-events:none;
    display:flex;justify-content:space-between;font-weight:400}
  #hud .num{font-variant-numeric:tabular-nums;color:#c8551f}
  #hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    color:rgba(31,26,22,0.4);font-size:clamp(11px,1.1vw,13px);text-align:center;
    pointer-events:none;line-height:1.6;letter-spacing:.06em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="levelName"></span><span class="num" id="orbCount"></span></div>
<div id="hint">колесо · ← → — вращение &nbsp;·&nbsp; ОК — прыжок &nbsp;·&nbsp; back — заново</div>
<script>
(function(){
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', {alpha:false});
  const elLevel = document.getElementById('levelName');
  const elOrbs  = document.getElementById('orbCount');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- PRNG ----
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---- Grain texture (hand-made feel) ----
  const grainCanvas = document.createElement('canvas');
  grainCanvas.width = grainCanvas.height = 200;
  (function() {
    const g = grainCanvas.getContext('2d');
    const img = g.createImageData(200, 200);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 255;
    }
    g.putImageData(img, 0, 0);
  })();
  let grainPattern = null;
  function getGrain() {
    if (!grainPattern) grainPattern = ctx.createPattern(grainCanvas, 'repeat');
    return grainPattern;
  }

  // ---- Constants & palette ----
  const G = 1500, BALL_R = 13, JUMP_IMPULSE = 750;
  const COLOR = {
    bg:          '#f4ecd8',
    ink:         '#1f1a16',
    inkSoft:     'rgba(31,26,22,0.14)',
    orb:         '#c8551f',
    exitOpen:    '#2d5a3d',
    exitLocked:  '#a89f8e',
    ringLocked:  '#6b6259',
    dust:        '#a89f8e',
  };

  // ---- Procedural level generation ----
  function generateLevel(n) {
    const rng = mulberry32((n + 1) * 7919 + 1337);
    const difficulty = Math.min(1, n / 12);
    const walls = [];
    const orbs  = [];

    // Outer boundaries (no bottom — exit sits there)
    walls.push({x:-450, y:-400, w:20, h:800});   // left
    walls.push({x: 430, y:-400, w:20, h:800});   // right
    walls.push({x:-450, y:-400, w:900, h:20});   // top
    walls.push({x:-450, y: 380, w:900, h: 20}); 

    
    // Starter platform — tutorial safety net + free orb
    walls.push({x:-100, y:-280, w:200, h:20});
    orbs.push({x: 0, y:-302});

    // Random platforms
    const numPlatforms = 3 + Math.floor(rng() * (2 + difficulty * 3));
    const zTop = -180, zBot = 300;
    const spacing = (zBot - zTop) / numPlatforms;

    for (let i = 0; i < numPlatforms; i++) {
      const y = zTop + i * spacing + (rng() - 0.5) * 24;
      const side = rng() < 0.5 ? -1 : 1;
      const minW = 150;
      const maxW = 200 + difficulty * 280;
      const width = minW + rng() * (maxW - minW);
      const maxOffset = Math.min(840 - width, 60 + difficulty * 140);
      const offset = rng() * maxOffset;
      const px = side === -1 ? (-430 + offset) : (430 - width - offset);

      walls.push({x: px, y, w: width, h: 20});

      // Orb near the free (inner) end of the platform
      const orbX = side === -1 ? (px + width - 50) : (px + 50);
      orbs.push({x: orbX, y: y - 22});
    }

    return {
      name: 'Уровень ' + (n + 1),
      ball: {x: 0, y: -360},
      walls, orbs,
      exit: {x: 0, y: 350, r: 28}
    };
  }

  // ---- Game state ----
  let levelIndex = 0;
  let level = null;
  let angle = 0, targetAngle = 0;
  let ball = {x:0, y:0, vx:0, vy:0};
  let won = false, winTimer = 0;
  let particles = [], trail = [], time = 0, jumpCooldown = 0;

  function loadLevel(i) {
    levelIndex = i;
    level = generateLevel(i);
    level.orbs.forEach(o => o.taken = false);
    ball = {x: level.ball.x, y: level.ball.y, vx: 0, vy: 0};
    angle = 0; targetAngle = 0;
    won = false; winTimer = 0;
    particles = []; trail = [];
    jumpCooldown = 0;
    updateHud();
  }

  function updateHud() {
    elLevel.textContent = level.name;
    const total = level.orbs.length;
    const got = level.orbs.filter(o => o.taken).length;
    elOrbs.textContent = '● ' + got + '/' + total;
  }

  function spawnBurst(x, y, color, n, maxLife) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 200;
      particles.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: maxLife * (0.5 + Math.random() * 0.5),
        maxLife, color,
        r: 1.5 + Math.random() * 2
      });
    }
  }

  // ---- Physics ----
  function collideAABB(w) {
    const cx = Math.max(w.x, Math.min(ball.x, w.x + w.w));
    const cy = Math.max(w.y, Math.min(ball.y, w.y + w.h));
    const dx = ball.x - cx, dy = ball.y - cy;
    const d2 = dx*dx + dy*dy;
    if (d2 >= BALL_R * BALL_R) return;

    let nx, ny;
    const d = Math.sqrt(d2);
    if (d > 0.0001) { nx = dx/d; ny = dy/d; }
    else {
      const l = ball.x - w.x, r = (w.x + w.w) - ball.x;
      const t = ball.y - w.y, b = (w.y + w.h) - ball.y;
      const m = Math.min(l, r, t, b);
      if      (m === l) { nx = -1; ny = 0; }
      else if (m === r) { nx =  1; ny = 0; }
      else if (m === t) { nx =  0; ny = -1; }
      else               { nx =  0; ny =  1; }
    }

    const overlap = BALL_R - d;
    ball.x += nx * overlap;
    ball.y += ny * overlap;

    const vn = ball.vx*nx + ball.vy*ny;
    if (vn < 0) {
      const bo = 0.2;
      ball.vx -= (1 + bo) * vn * nx;
      ball.vy -= (1 + bo) * vn * ny;
      if (vn < -400) {
        spawnBurst(ball.x - nx*BALL_R, ball.y - ny*BALL_R, COLOR.dust, 3, 0.35);
      }
    }
  }

  function step(dt) {
    if (won) {
      winTimer -= dt;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt;
        p.vx *= Math.pow(0.4, dt); p.vy *= Math.pow(0.4, dt);
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      if (winTimer <= 0) loadLevel(levelIndex + 1);
      return;
    }

    angle += (targetAngle - angle) * Math.min(1, dt*12);
    if (jumpCooldown > 0) jumpCooldown -= dt;

    const gx = G * Math.sin(angle);
    const gy = G * Math.cos(angle);
    ball.vx += gx*dt; ball.vy += gy*dt;

    const damp = Math.pow(0.5, dt);
    ball.vx *= damp; ball.vy *= damp;
    ball.x  += ball.vx*dt; ball.y += ball.vy*dt;

    for (let i = 0; i < level.walls.length; i++) collideAABB(level.walls[i]);

    const sp = Math.hypot(ball.vx, ball.vy);
    if (sp > 2400) { ball.vx *= 2400/sp; ball.vy *= 2400/sp; }

    // Trail
    trail.push({x: ball.x, y: ball.y, life: 1});
    if (trail.length > 22) trail.shift();
    for (let i = 0; i < trail.length; i++) trail[i].life -= dt * 2.5;
    while (trail.length && trail[0].life <= 0) trail.shift();

    // Orbs
    for (let i = 0; i < level.orbs.length; i++) {
      const o = level.orbs[i];
      if (o.taken) continue;
      const dx = o.x - ball.x, dy = o.y - ball.y;
      if (dx*dx + dy*dy < (BALL_R + 14) * (BALL_R + 14)) {
        o.taken = true;
        spawnBurst(o.x, o.y, COLOR.orb, 12, 0.6);
        updateHud();
      }
    }

    // Win check
    const allTaken = level.orbs.every(o => o.taken);
    if (allTaken) {
      const dx = level.exit.x - ball.x, dy = level.exit.y - ball.y;
      if (dx*dx + dy*dy < (level.exit.r + BALL_R - 4) ** 2) {
        won = true;
        winTimer = 1.2;
        spawnBurst(level.exit.x, level.exit.y, COLOR.exitOpen, 24, 1.0);
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= Math.pow(0.4, dt); p.vy *= Math.pow(0.4, dt);
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ---- Input ----
  function doJump() {
    if (won || jumpCooldown > 0) return;
    jumpCooldown = 0.15;
    ball.vx += -JUMP_IMPULSE * Math.sin(angle);
    ball.vy += -JUMP_IMPULSE * Math.cos(angle);
    spawnBurst(ball.x, ball.y, COLOR.ink, 4, 0.3);
  }

  window.addEventListener('wheel', e => {
    e.preventDefault();
    targetAngle += (e.deltaY || 0) * 0.003;
  }, {passive:false});

  window.addEventListener('keydown', e => {
    const k = e.keyCode;
    if      (k === 37) targetAngle -= 0.12;
    else if (k === 39) targetAngle += 0.12;
    else if (k === 13 || k === 32) doJump();
    else if (k === 82) loadLevel(levelIndex);
    else if (k === 461) { e.preventDefault(); loadLevel(levelIndex); }
    else if (k === 403) loadLevel(0);
    else if (k === 404) loadLevel(levelIndex + 1);
  });
  canvas.addEventListener('pointerdown', e => { if (e.button === 0) doJump(); });

  // ---- Rendering ----
  function render() {
    // Cream paper
    ctx.fillStyle = COLOR.bg;
    ctx.fillRect(0, 0, W, H);

    // Vignette
    const vig = ctx.createRadialGradient(W/2, H*0.45, Math.min(W,H)*0.25, W/2, H/2, Math.max(W,H)*0.8);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(31,26,22,0.13)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    const cx = W/2, cy = H/2;
    const scale = Math.min(W/1050, H/950);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    // Faint dot-grid (graph-paper feel; rotates with the room)
    ctx.fillStyle = 'rgba(31,26,22,0.06)';
    for (let x = -400; x <= 400; x += 80) {
      for (let y = -380; y <= 380; y += 80) {
        ctx.fillRect(x-1, y-1, 2, 2);
      }
    }

    // Walls
    for (let i = 0; i < level.walls.length; i++) {
      const w = level.walls[i];
      ctx.fillStyle = COLOR.inkSoft;
      ctx.fillRect(w.x + 3, w.y + 3, w.w, w.h);
      ctx.fillStyle = COLOR.ink;
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.fillStyle = 'rgba(244,236,216,0.4)';
      ctx.fillRect(w.x, w.y, w.w, 1.2);
    }

    // Orbs
    const pulse = 1 + Math.sin(time*3) * 0.05;
    for (let i = 0; i < level.orbs.length; i++) {
      const o = level.orbs[i];
      if (o.taken) continue;
      const r = 11 * pulse;
      ctx.fillStyle = COLOR.inkSoft;
      ctx.beginPath(); ctx.arc(o.x+1, o.y+2, r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = COLOR.orb;
      ctx.beginPath(); ctx.arc(o.x, o.y, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = COLOR.bg; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(o.x, o.y, r*0.5, 0, Math.PI*2); ctx.stroke();
    }

    // Exit
    const allTaken = level.orbs.every(o => o.taken);
    const exitFill = allTaken ? COLOR.exitOpen : COLOR.exitLocked;
    const exitRing = allTaken ? COLOR.ink : COLOR.ringLocked;
    const ep = allTaken ? 1 + Math.sin(time*2.5) * 0.05 : 1;
    ctx.save();
    ctx.translate(level.exit.x, level.exit.y);
    ctx.scale(ep, ep);
    ctx.fillStyle = COLOR.inkSoft;
    ctx.beginPath(); ctx.arc(2, 2, level.exit.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = exitFill;
    ctx.beginPath(); ctx.arc(0, 0, level.exit.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = exitRing; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, level.exit.r, 0, Math.PI*2); ctx.stroke();
    if (allTaken) {
      ctx.fillStyle = COLOR.bg;
      ctx.beginPath(); ctx.arc(0, 0, level.exit.r*0.32, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.strokeStyle = COLOR.bg; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-level.exit.r*0.35, 0);
      ctx.lineTo( level.exit.r*0.35, 0);
      ctx.stroke();
    }
    ctx.restore();

    // Trail
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      const a = Math.max(0, t.life);
      ctx.globalAlpha = a * 0.35;
      ctx.fillStyle = COLOR.ink;
      ctx.beginPath(); ctx.arc(t.x, t.y, BALL_R*0.6*a, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Particles (tiny squares — riso-print feel)
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.r, p.y - p.r, p.r*2, p.r*2);
    }
    ctx.globalAlpha = 1;

    // Ball
    ctx.fillStyle = COLOR.inkSoft;
    ctx.beginPath(); ctx.arc(ball.x+1.5, ball.y+1.5, BALL_R, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = COLOR.ink;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = COLOR.bg;
    ctx.beginPath();
    ctx.arc(ball.x - BALL_R*0.3, ball.y - BALL_R*0.3, BALL_R*0.28, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // Grain overlay
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.09;
    ctx.fillStyle = getGrain();
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Win overlay
    if (won) {
      const alpha = Math.min(1, winTimer * 2.5);
      ctx.fillStyle = 'rgba(244,236,216,' + (0.72*alpha) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = COLOR.ink;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'italic ' + Math.round(Math.min(W,H) * 0.07) + 'px Georgia, serif';
      ctx.fillText('уровень пройден', W/2, H/2);
      ctx.globalAlpha = 1;
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    time += dt;
    step(dt);
    render();
    requestAnimationFrame(loop);
  }

  loadLevel(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
