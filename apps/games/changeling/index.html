<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Перевёртыш</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#06060e;cursor:none;
    font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:24px;left:32px;right:32px;color:#7fc8ff;font-weight:700;
    font-size:clamp(18px,2.2vw,28px);letter-spacing:.02em;pointer-events:none;
    text-shadow:0 0 12px rgba(120,200,255,.5);display:flex;justify-content:space-between}
  #hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#4a6a8a;
    font-size:clamp(12px,1.4vw,16px);text-align:center;pointer-events:none;line-height:1.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="levelName"></span><span id="orbCount"></span></div>
<div id="hint">Колесо / ← → — вращать · ОК / клик — прыжок · Back / R — заново · Зелёная — пропуск</div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', {alpha:false});
  const elLevel = document.getElementById('levelName');
  const elOrbs  = document.getElementById('orbCount');

  let W=0,H=0,DPR=1;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.max(1, Math.floor(W*DPR));
    canvas.height = Math.max(1, Math.floor(H*DPR));
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize); resize();

  const G = 1500, BALL_R = 13, JUMP_IMPULSE = 750;

  const LEVELS = [
    {
      name: "1 · Первый шаг",
      ball: {x: 0, y: 160},
      walls: [
        {x:-450, y:-400, w:900, h:20},
        {x:-450, y: 380, w:900, h:20},
        {x:-450, y:-400, w:20, h:800},
        {x: 430, y:-400, w:20, h:800},
        {x:-430, y: 220, w:860, h:20},
      ],
      orbs: [{x:-380, y:190}, {x:380, y:190}],
      exit: {x:0, y:190, r:26},
    },
    {
      name: "2 · Спуск",
      ball: {x: 0, y: -350},
      walls: [
        {x:-450, y:-400, w:900, h:20},
        {x:-450, y: 380, w:900, h:20},
        {x:-450, y:-400, w:20, h:800},
        {x: 430, y:-400, w:20, h:800},
        {x:-430, y:-180, w:300, h:20},
        {x: 130, y:-180, w:300, h:20},
        {x:-150, y:  20, w:300, h:20},
        {x:-430, y: 220, w:300, h:20},
        {x: 130, y: 220, w:300, h:20},
      ],
      orbs: [
        {x:-280, y:-230},{x:280, y:-230},
        {x:0, y:-30},
        {x:-280, y:180},{x:280, y:180},
      ],
      exit: {x:0, y:180, r:26},
    },
    {
      name: "3 · Лабиринт",
      ball: {x: -350, y: -350},
      walls: [
        {x:-450, y:-400, w:900, h:20},
        {x:-450, y: 380, w:900, h:20},
        {x:-450, y:-400, w:20, h:800},
        {x: 430, y:-400, w:20, h:800},
        {x:-430, y:-250, w:400, h:20},
        {x: 100, y:-250, w:330, h:20},
        {x:-150, y: -80, w:500, h:20},
        {x:-430, y:  50, w:400, h:20},
        {x: 100, y:  50, w:330, h:20},
        {x:-150, y: 220, w:300, h:20},
      ],
      orbs: [
        {x:-200, y:-300},{x:200, y:-300},
        {x:-250, y:-160},{x:200, y:-130},
        {x:-250, y:100},{x:200, y:120},
      ],
      exit: {x:0, y:320, r:26},
    },
  ];

  let levelIndex=0, level=null;
  let angle=0, targetAngle=0;
  let ball={x:0,y:0,vx:0,vy:0};
  let won=false, winTimer=null;
  let particles=[], trail=[], time=0, jumpCooldown=0;

  function loadLevel(i){
    levelIndex = ((i % LEVELS.length) + LEVELS.length) % LEVELS.length;
    const L = JSON.parse(JSON.stringify(LEVELS[levelIndex]));
    level = L;
    L.orbs.forEach(o => o.taken = false);
    ball = {x:L.ball.x, y:L.ball.y, vx:0, vy:0};
    angle = 0; targetAngle = 0;
    won = false; particles = []; trail = []; jumpCooldown = 0;
    if (winTimer){ clearTimeout(winTimer); winTimer = null; }
    updateHud();
  }
  function updateHud(){
    elLevel.textContent = level.name;
    const total = level.orbs.length;
    const got = level.orbs.filter(o=>o.taken).length;
    elOrbs.textContent = '● ' + got + '/' + total;
  }

  // ============ Ввод ============
  window.addEventListener('wheel', e => {
    e.preventDefault();
    targetAngle += (e.deltaY || 0) * 0.003;
  }, {passive:false});

  function doJump(){
    if (won || jumpCooldown > 0) return;
    jumpCooldown = 0.15;
    ball.vx += -JUMP_IMPULSE * Math.sin(angle);
    ball.vy += -JUMP_IMPULSE * Math.cos(angle);
    spawnBurst(ball.x, ball.y, '#8ad0ff', 8, 0.4);
  }

  window.addEventListener('keydown', e => {
    const k = e.keyCode;
    if (k===37) targetAngle -= 0.12;              // ←
    else if (k===39) targetAngle += 0.12;         // →
    else if (k===13 || k===32) doJump();          // Enter/OK/Space
    else if (k===82) loadLevel(levelIndex);       // R
    else if (k===461){ e.preventDefault(); loadLevel(levelIndex); } // Back
    else if (k===403) loadLevel(0);               // красная — с начала
    else if (k===404) loadLevel(levelIndex+1);    // зелёная — пропуск
  });
  canvas.addEventListener('pointerdown', e => { if (e.button===0) doJump(); });

  // ============ Частицы ============
  function spawnBurst(x,y,color,n,maxLife){
    maxLife = maxLife || 0.8;
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = 80+Math.random()*250;
      particles.push({
        x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
        life: maxLife*(0.6+Math.random()*0.4), maxLife, color,
        r: 2+Math.random()*3
      });
    }
  }

  // ============ Физика (AABB в координатах комнаты) ============
  function collideAABB(w){
    const cx = Math.max(w.x, Math.min(ball.x, w.x+w.w));
    const cy = Math.max(w.y, Math.min(ball.y, w.y+w.h));
    const dx = ball.x-cx, dy = ball.y-cy;
    const d2 = dx*dx+dy*dy;
    if (d2 >= BALL_R*BALL_R) return;
    let nx,ny; const d = Math.sqrt(d2);
    if (d > 0.0001){ nx=dx/d; ny=dy/d; }
    else {
      const l=ball.x-w.x, r=(w.x+w.w)-ball.x, t=ball.y-w.y, b=(w.y+w.h)-ball.y;
      const m = Math.min(l,r,t,b);
      if (m===l){nx=-1;ny=0} else if (m===r){nx=1;ny=0}
      else if (m===t){nx=0;ny=-1} else {nx=0;ny=1}
    }
    const overlap = BALL_R - d;
    ball.x += nx*overlap; ball.y += ny*overlap;
    const vn = ball.vx*nx + ball.vy*ny;
    if (vn < 0){ const bo=0.2; ball.vx -= (1+bo)*vn*nx; ball.vy -= (1+bo)*vn*ny; }
  }

  function step(dt){
    if (won) return;
    angle += (targetAngle - angle) * Math.min(1, dt*12);
    if (jumpCooldown > 0) jumpCooldown -= dt;

    const gx = G*Math.sin(angle), gy = G*Math.cos(angle);
    ball.vx += gx*dt; ball.vy += gy*dt;
    const damp = Math.pow(0.5, dt);
    ball.vx *= damp; ball.vy *= damp;
    ball.x += ball.vx*dt; ball.y += ball.vy*dt;

    for (let i=0;i<level.walls.length;i++) collideAABB(level.walls[i]);

    const sp = Math.hypot(ball.vx, ball.vy);
    if (sp > 2400){ ball.vx *= 2400/sp; ball.vy *= 2400/sp; }

    trail.push({x:ball.x, y:ball.y, life:1});
    if (trail.length > 20) trail.shift();
    for (let i=0;i<trail.length;i++) trail[i].life -= dt*3;
    while (trail.length && trail[0].life <= 0) trail.shift();

    for (let i=0;i<level.orbs.length;i++){
      const o = level.orbs[i];
      if (o.taken) continue;
      const dx=o.x-ball.x, dy=o.y-ball.y;
      if (dx*dx+dy*dy < (BALL_R+16)*(BALL_R+16)){
        o.taken = true; spawnBurst(o.x, o.y, '#ffcc33', 14, 0.7);
        updateHud();
      }
    }

    const allTaken = level.orbs.every(o=>o.taken);
    if (allTaken){
      const dx=level.exit.x-ball.x, dy=level.exit.y-ball.y;
      if (dx*dx+dy*dy < (level.exit.r+BALL_R-4)*(level.exit.r+BALL_R-4)) winLevel();
    }

    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= Math.pow(0.4, dt); p.vy *= Math.pow(0.4, dt);
      p.life -= dt;
      if (p.life <= 0) particles.splice(i,1);
    }
  }
  function winLevel(){
    won = true;
    spawnBurst(level.exit.x, level.exit.y, '#66ff99', 30, 1.2);
    winTimer = setTimeout(()=>loadLevel(levelIndex+1), 1100);
  }

  // ============ Рендер ============
  function render(){
    const bg = ctx.createRadialGradient(W*0.5, H*0.4, 0, W*0.5, H*0.5, Math.max(W,H)*0.7);
    bg.addColorStop(0, '#12182a'); bg.addColorStop(1, '#06060e');
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

    const cx = W/2, cy = H/2;
    const scale = Math.min(W/1050, H/950);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    for (let i=0;i<level.walls.length;i++){
      const w = level.walls[i];
      ctx.fillStyle = '#0e1420'; ctx.fillRect(w.x+3, w.y+3, w.w, w.h);
      ctx.fillStyle = '#1c2a44'; ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = '#4a90e2'; ctx.lineWidth = 2.5;
      ctx.strokeRect(w.x+1.25, w.y+1.25, w.w-2.5, w.h-2.5);
      ctx.strokeStyle = 'rgba(140,200,255,.35)'; ctx.lineWidth = 1;
      ctx.strokeRect(w.x+3, w.y+3, w.w-6, w.h-6);
    }

    for (let i=0;i<level.orbs.length;i++){
      const o = level.orbs[i];
      if (o.taken) continue;
      const pulse = 1 + Math.sin(time*4 + i*0.7)*0.15;
      ctx.save(); ctx.translate(o.x, o.y);
      const gr = ctx.createRadialGradient(0,0,0, 0,0,40);
      gr.addColorStop(0,'rgba(255,210,60,.55)'); gr.addColorStop(1,'rgba(255,210,60,0)');
      ctx.fillStyle = gr; ctx.fillRect(-40,-40,80,80);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff4c0'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }

    const allTaken = level.orbs.every(o=>o.taken);
    const ep = 1 + Math.sin(time*2.5)*0.08;
    ctx.save(); ctx.translate(level.exit.x, level.exit.y); ctx.scale(ep,ep);
    const eg = ctx.createRadialGradient(0,0,0, 0,0, level.exit.r*2.2);
    if (allTaken){ eg.addColorStop(0,'rgba(100,255,150,.8)'); eg.addColorStop(1,'rgba(100,255,150,0)'); }
    else { eg.addColorStop(0,'rgba(100,120,180,.35)'); eg.addColorStop(1,'rgba(100,120,180,0)'); }
    ctx.fillStyle = eg; ctx.fillRect(-level.exit.r*2.2, -level.exit.r*2.2, level.exit.r*4.4, level.exit.r*4.4);
    ctx.strokeStyle = allTaken ? '#66ff99' : '#3a4a6a'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(0,0,level.exit.r,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = allTaken ? 'rgba(100,255,150,.4)' : 'rgba(58,74,106,.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0,0,level.exit.r*0.6,0,Math.PI*2); ctx.stroke();
    ctx.restore();

    for (let i=0;i<trail.length;i++){
      const t = trail[i], a = Math.max(0,Math.min(1,t.life));
      ctx.globalAlpha = a*0.5;
      ctx.fillStyle = '#8ad0ff';
      ctx.beginPath(); ctx.arc(t.x, t.y, BALL_R*0.7*a, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (let i=0;i<particles.length;i++){
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life/p.maxLife*1.5));
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.save(); ctx.translate(ball.x, ball.y);
    const glow = ctx.createRadialGradient(0,0,0, 0,0, BALL_R*3);
    glow.addColorStop(0,'rgba(120,200,255,.55)'); glow.addColorStop(1,'rgba(120,200,255,0)');
    ctx.fillStyle = glow; ctx.fillRect(-BALL_R*3,-BALL_R*3,BALL_R*6,BALL_R*6);
    const body = ctx.createRadialGradient(-BALL_R*.3,-BALL_R*.3,0, 0,0,BALL_R);
    body.addColorStop(0,'#d4efff'); body.addColorStop(1,'#5aa8e0');
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0,0,BALL_R,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#e8f8ff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();

    ctx.restore();

    if (won){
      ctx.fillStyle = 'rgba(6,6,14,.5)'; ctx.fillRect(0,0,W,H);
      ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font = 'bold '+Math.round(Math.min(W,H)*0.15)+'px system-ui,sans-serif';
      ctx.fillStyle = '#66ff99'; ctx.shadowColor = '#66ff99'; ctx.shadowBlur = 40;
      ctx.fillText('✓', W/2, H/2); ctx.restore();
    }
  }

  let last = performance.now();
  function loop(now){
    let dt = (now - last)/1000; last = now;
    if (dt > 0.05) dt = 0.05;
    time += dt;
    step(dt); render();
    requestAnimationFrame(loop);
  }
  loadLevel(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
